  - id: XRL-01
    name: Refund and item-not-received abuse
    family: cross_rail
    rails: [card_not_present, agentic_token]
    genai_leverage: Persuasive, individualised claim narratives generated instantly.
    mechanism: >
      Attacker or opportunistic user files fabricated non-delivery or
      not-as-described claims, with narratives tuned to the merchant's own
      published policy language.
    signals:
      - claim rate per account far above cohort
      - narrative similarity clustering across unrelated accounts
    parameters:
      claims_per_account: {type: int, range: [1, 40]}
      narrative_similarity: {type: float, range: [0.0, 0.95]}
      claim_value_usd: {type: float, range: [20, 3000]}
      policy_language_mirroring: {type: float, range: [0.0, 1.0]}
    defense_hooks:
      - account_claim_rate_vs_cohort
      - claim_narrative_embedding_cluster_density
    difficulty: 0.98
    difficulty_prior: 0.5
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: XRL-02
    name: Automated friendly fraud chargeback farming
    family: cross_rail
    rails: [card_not_present]
    genai_leverage: Dispute filing and representment rebuttal automated per case.
    mechanism: >
      Disputes are filed at volume with reason codes selected to maximise win
      probability given merchant category and evidence norms.
    signals:
      - reason code selection statistically optimal rather than natural
      - dispute filed close to the deadline boundary
    parameters:
      disputes_per_account: {type: int, range: [1, 25]}
      reason_code_optimality: {type: float, range: [0.0, 1.0]}
      days_to_deadline: {type: int, range: [0, 120]}
    defense_hooks:
