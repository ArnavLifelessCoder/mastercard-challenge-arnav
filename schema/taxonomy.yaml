    signals:
      - bank detail change on an established supplier record
      - change request arriving out of the normal procurement channel
    parameters:
      supplier_relationship_months: {type: int, range: [1, 120]}
      invoice_value_usd: {type: float, range: [5000, 2000000]}
      channel_deviation: {type: bool}
      style_match_quality: {type: float, range: [0.5, 0.99]}
    defense_hooks:
      - supplier_bank_detail_change_control
      - change_request_channel_conformance
    difficulty: 0.0
    difficulty_prior: 0.7
    difficulty_source: measured_evasion_rate_round_7
