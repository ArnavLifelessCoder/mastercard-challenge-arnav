coverage_summary:
  total_vectors: 42
  by_family:
    agent_hijack: 9
    mandate_abuse: 8
    identity_spoofing: 8
    classical_genai: 10
    cross_rail: 7
  status_note: >
    `status: implemented` marks the intended build set, 29 vectors. It is
    aspirational until the generator exists. Build in tier order and let the
    tail slip if time runs out; tier 1 alone is sufficient for the headline
    experiment.
  build_order:
    tier_1_must_have: [AGH-01, AGH-09, MND-01, MND-02, MND-05, IDS-05, CGA-01, CGA-03, CGA-04, CGA-05, CGA-06, CGA-09]
    tier_2_high_value: [AGH-02, AGH-03, AGH-04, AGH-07, MND-03, MND-04, IDS-01, IDS-03, XRL-03, XRL-04]
    tier_3_if_time: [MND-07, IDS-02, IDS-07, IDS-04, CGA-08, XRL-01, XRL-06]
  headline_experiment:
    control_set: [CGA-01, CGA-03, CGA-05, CGA-06, CGA-09]
    treatment_set: [AGH-01, AGH-09, MND-01, MND-02, MND-05, IDS-05]
    claim: >
      A conventional transaction-feature detector trained on the control set
      degrades toward random on the treatment set, because agentic fraud produces
      clean, fast, successful authorizations. An intent-provenance detector
      recovers performance without raising decline rate.
