meta:
  name: Agentic Payments Red Team Taxonomy
  version: "0.3.0"
  scope: >
    Attack vectors targeting payment rails where a GenAI system is either the
    attacker, the victim, or the transacting party. Weighted deliberately toward
    agentic commerce rails (Mastercard Agent Pay / Agentic Tokens, Visa Trusted
    Agent, AP2, ACP, UCP) because that surface is live in production and has the
    thinnest fraud tooling today.
  difficulty_provenance: >
    v0.3.0. Every implemented vector now carries a measured `difficulty` taken
    from its round-7 evasion rate against the arm G detector in
    experiments/coevolution.py. The original hand-set prior is preserved as
    `difficulty_prior` so the two can be compared. Where they disagree sharply
    the prior was wrong, not the measurement: AGH-07 was guessed at 0.70 and
    measures 0.00, MND-04 was guessed at 0.55 and measures 0.00, while AGH-02
    was guessed at 0.70 and measures 1.00.
  ratio_convention: >
    v0.2.0 normalisation. Every parameter whose name ends in _ratio, _multiple or
    _multiplier is a multiplier where 1.0 means unchanged. v0.1.0 mixed additive
    fractions and multipliers in the same file, which would have silently halved
    or doubled generated amounts depending on which vector emitted them. Renamed:
    cart_delta_ratio -> cart_value_ratio, price_discount_vs_median ->
    price_ratio_to_median, price_divergence -> checkout_to_retrieved_price_ratio,
    price_below_market -> price_ratio_to_market, feed_vs_auth_delta ->
    auth_to_feed_price_ratio. Fractions of a stated bound (cap_proximity,
    amount_vs_balance_ratio, conversion_rate) keep fraction semantics.
  usage: >
    This file is the single source of truth for all three pillars. The Identify
    pillar is this document. The Generate pillar reads `parameters` as the attack
    genome and samples from the declared ranges. The Defend pillar reads
    `defense_hooks` as the feature engineering backlog and `signals` as the
    observability requirement. The coevolution loop mutates `parameters` within
    range and uses `difficulty` as its prior.

schema:
  id: Stable identifier. Never reuse or renumber.
  family: One of the families declared below.
  rails: Payment rails the vector touches.
  genai_leverage: What generative AI specifically buys the attacker here.
  mechanism: How the attack actually executes, grounded in real system behaviour.
  signals: Observable evidence available to a defender at or before authorization.
  parameters: Simulatable knobs. Each has a type and a sampling range. This is the genome.
  defense_hooks: Candidate detection features. Seeds the Defend pillar.
  difficulty: Prior on detection hardness, 0 (trivial) to 1 (near invisible).
  status: implemented | stub. Only `implemented` vectors have working generators.

families:
  agent_hijack: >
    The user's own agent is turned against them by content it ingests. The
    resulting authorization is cryptographically valid and mandate-compliant.
  mandate_abuse: >
    The agentic token's scope, consent policy, or memory is manipulated so that
    fraudulent spend stays technically inside the granted envelope.
  identity_spoofing: >
    Either the agent or the merchant is not who the other party believes it is.
    Attacks the Know Your Agent trust anchor.
  classical_genai: >
    Pre-agentic fraud typologies where GenAI collapses cost, scale, or fidelity.
    Included for taxonomy breadth and as the control group for the headline
    experiment.
  cross_rail: >
    Post-authorization and multi-party abuse: refunds, chargebacks, stored value,
    B2B, mule networks.

rails_enum:
  - card_not_present
  - agentic_token
  - card_present
  - account_to_account
  - instant_payment
  - stored_value
  - b2b_invoice

# ---------------------------------------------------------------------------
# FAMILY: agent_hijack
# ---------------------------------------------------------------------------

vectors:

  - id: AGH-01
    name: Checkout-page indirect prompt injection
    family: agent_hijack
    rails: [agentic_token, card_not_present]
    genai_leverage: Agent reads page content as instruction, not data.
    mechanism: >
      Attacker controls or compromises content on a merchant page the agent
      parses during checkout. Hidden text instructs the agent to alter the
      shipping address, add a line item, or complete purchase without the
      confirmation step. The agent submits a valid authorization.
    signals:
      - divergence between user utterance intent and final cart contents
      - shipping address never previously seen on the account
      - checkout completed with zero user confirmation events
      - unusually short dwell time between cart build and submit
    parameters:
      injection_placement: {type: categorical, values: [visible_text, aria_label, alt_text, css_hidden, comment_node]}
      payload_specificity: {type: float, range: [0.0, 1.0], desc: 0 is vague nudge, 1 is fully specified txn}
      cart_value_ratio: {type: float, range: [1.0, 4.0], desc: final cart value over user-intended value, 1.0 is unchanged}
      confirmation_suppressed: {type: bool}
      agent_model_susceptibility: {type: float, range: [0.0, 0.5], desc: empirical rate, ~4/26 models compromised in Zscaler tests}
    defense_hooks:
      - intent_cart_semantic_distance
      - confirmation_event_present
      - shipping_address_novelty_score
      - page_content_injection_classifier_score
    difficulty: 0.94
    difficulty_prior: 0.85
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: AGH-02
    name: Product review corpus injection
    family: agent_hijack
    rails: [agentic_token, card_not_present]
    genai_leverage: Reviews are user-generated, unmoderated for agent-directed text.
    mechanism: >
      Attacker seeds review text on a legitimate marketplace with instructions
      addressed to shopping agents. Agent summarizing reviews ingests the payload
      and redirects purchase toward the attacker's listing or applies an
      attacker-supplied discount code that maps to a stored value drain.
    signals:
      - agent selected a listing with anomalous review recency clustering
      - listing seller age below threshold
      - price materially below category median
    parameters:
      review_count_seeded: {type: int, range: [1, 50]}
      review_recency_days: {type: int, range: [0, 30]}
      price_ratio_to_median: {type: float, range: [0.3, 0.9], desc: listing price over category median}
      seller_account_age_days: {type: int, range: [0, 180]}
    defense_hooks:
      - seller_tenure
      - price_deviation_from_category_median
      - review_burst_score
    difficulty: 1.0
    difficulty_prior: 0.7
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: AGH-03
    name: Hidden DOM and meta-tag injection
    family: agent_hijack
    rails: [agentic_token]
    genai_leverage: Agents parse structured markup humans never see.
    mechanism: >
      Instructions embedded in meta tags, JSON-LD blocks, or zero-opacity nodes
      route financial actions toward attacker endpoints. Invisible to human
      review, fully legible to the agent's DOM extraction.
    signals:
      - mismatch between rendered visible text and extracted agent context
      - payee endpoint not matching merchant of record
    parameters:
      tag_type: {type: categorical, values: [meta, json_ld, script_comment, zero_opacity_div, off_canvas]}
      endpoint_mismatch: {type: bool}
      obfuscation_level: {type: float, range: [0.0, 1.0]}
    defense_hooks:
      - visible_vs_extracted_text_delta
      - payee_merchant_of_record_match
    difficulty: 0.88
    difficulty_prior: 0.8
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: AGH-04
    name: SEO poisoning to injected landing page
    family: agent_hijack
    rails: [agentic_token, card_not_present]
    genai_leverage: Keyword-dense pages generated at scale to capture agent search.
    mechanism: >
      Attacker builds keyword-heavy pages targeting queries agents make during
      task execution, then hides payment instructions in them. Documented in the
      wild against package-installation and API-key acquisition queries.
    signals:
      - merchant domain first seen within trailing 90 days
      - agent arrived at merchant via organic search rather than known catalog
      - transaction framed as fee or API access rather than goods
    parameters:
      domain_age_days: {type: int, range: [1, 365]}
      query_intent: {type: categorical, values: [software_dependency, api_key, subscription, service_fee, physical_goods]}
      serp_rank: {type: int, range: [1, 10]}
      requested_amount_usd: {type: float, range: [5, 500]}
    defense_hooks:
      - merchant_domain_age
      - acquisition_channel
      - mcc_vs_stated_intent_consistency
    difficulty: 0.9
    difficulty_prior: 0.65
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: AGH-05
    name: Adversarial interstitial (fake CAPTCHA / PromptFix pattern)
    family: agent_hijack
    rails: [agentic_token]
    genai_leverage: Agent trained to resolve blockers autonomously will act on them.
    mechanism: >
      A fake verification widget carries instructions the agent executes in order
      to "pass" the check, triggering a download, credential disclosure, or
      out-of-scope payment.
    signals:
      - interaction with a non-standard verification widget
      - action taken immediately after blocker resolution
    parameters:
      widget_type: {type: categorical, values: [captcha, age_gate, cookie_wall, verification_email, human_check]}
      payload_action: {type: categorical, values: [download, payment, credential_disclosure, scope_expansion]}
      urgency_framing: {type: float, range: [0.0, 1.0]}
    defense_hooks:
      - blocker_resolution_to_action_latency
      - non_standard_widget_flag
    difficulty: 0.75
    status: stub

  - id: AGH-06
    name: Merchant catalog RAG poisoning
    family: agent_hijack
    rails: [agentic_token]
    genai_leverage: Retrieval layers ingest supplier feeds with no adversarial filter.
    mechanism: >
      Attacker poisons a product feed or catalog index the agent retrieves from,
      so that the retrieved context itself carries the malicious directive or a
      falsified price and fulfilment promise.
    signals:
      - catalog entry hash changed since last crawl
      - retrieved price diverges from checkout price
    parameters:
      poisoned_entry_fraction: {type: float, range: [0.001, 0.05]}
      checkout_to_retrieved_price_ratio: {type: float, range: [1.0, 10.0], desc: price charged over price retrieved}
      feed_source: {type: categorical, values: [supplier_feed, marketplace_index, affiliate_network, cached_crawl]}
    defense_hooks:
      - retrieved_vs_authorized_price_delta
      - catalog_entry_mutation_rate
    difficulty: 0.8
    status: stub

  - id: AGH-07
    name: Transactional email injection
    family: agent_hijack
    rails: [agentic_token, account_to_account]
    genai_leverage: Agents with inbox access treat mail bodies as trusted context.
    mechanism: >
      Attacker sends an order confirmation or invoice lookalike containing
      instructions the agent processes when triaging or reconciling. Frequently
      chains into payee redirection.
    signals:
      - sender domain unverified by DMARC
      - payee change instruction originating from inbound message
      - no corresponding user-initiated request
    parameters:
      spoof_quality: {type: float, range: [0.0, 1.0]}
      dmarc_pass: {type: bool}
      instruction_type: {type: categorical, values: [payee_change, amount_change, urgency_payment, refund_redirect]}
      thread_hijack: {type: bool}
    defense_hooks:
      - payee_change_provenance
      - inbound_message_authentication_status
      - user_initiation_trace_present
    difficulty: 0.0
    difficulty_prior: 0.7
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: AGH-08
    name: Tool and MCP server poisoning
    family: agent_hijack
    rails: [agentic_token, account_to_account]
    genai_leverage: Tool descriptions are prompt surface the agent trusts implicitly.
    mechanism: >
      A malicious or compromised tool server advertises a payment-capable tool
      whose description contains directives, or silently rewrites parameters
      between agent intent and execution.
    signals:
      - tool server not on registry allowlist
      - parameter drift between agent-declared and executed call
    parameters:
      server_trust_level: {type: categorical, values: [allowlisted, unknown, typosquatted, compromised_known]}
      parameter_drift_magnitude: {type: float, range: [0.0, 1.0]}
      tool_category: {type: categorical, values: [payment, wallet, ledger, checkout, refund]}
    defense_hooks:
      - tool_registry_attestation
      - declared_vs_executed_param_diff
    difficulty: 0.85
    status: stub

  - id: AGH-09
    name: Multi-turn conversational goal drift
    family: agent_hijack
    rails: [agentic_token]
    genai_leverage: Long-horizon agents accumulate context that shifts the objective.
    mechanism: >
      Rather than a single injection, the attacker distributes small nudges
      across many turns or many pages so no individual input trips a filter, but
      the cumulative objective is displaced toward attacker-favourable spend.
    signals:
      - objective drift measured across session turns
      - final purchase category diverges from initial stated need
    parameters:
      turns_to_drift: {type: int, range: [3, 40]}
      per_turn_nudge_magnitude: {type: float, range: [0.01, 0.3]}
      category_drift: {type: bool}
    defense_hooks:
      - session_objective_drift_score
      - initial_vs_final_intent_distance
    difficulty: 0.94
    difficulty_prior: 0.9
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

# ---------------------------------------------------------------------------
# FAMILY: mandate_abuse
# ---------------------------------------------------------------------------

  - id: MND-01
    name: Persistent memory poisoning of payee routing
    family: mandate_abuse
    rails: [account_to_account, b2b_invoice, agentic_token]
    genai_leverage: Agent long-term memory persists an instruction far past the session.
    mechanism: >
      Attacker plants a durable fact in agent memory, for example that invoices
      from a given vendor route to a new account. The instruction fires days or
      weeks later on a legitimate-looking trigger, decoupling the compromise from
      the fraudulent payment in time.
    signals:
      - payee record mutated with no contemporaneous user event
      - long latency between memory write and first use
      - memory write originated from ingested content, not user input
    parameters:
      dormancy_days: {type: int, range: [1, 90]}
      write_channel: {type: categorical, values: [support_ticket, email, document, web_page, user_utterance]}
      payee_delta: {type: categorical, values: [account_number, bank, name_only, full_replace]}
      value_at_risk_usd: {type: float, range: [500, 250000]}
    defense_hooks:
      - payee_mutation_provenance_chain
      - memory_write_to_execution_latency
      - user_event_correlation_window
    difficulty: 0.0
    difficulty_prior: 0.95
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: MND-02
    name: Cart mandate substitution
    family: mandate_abuse
    rails: [agentic_token]
    genai_leverage: Mandate is machine-generated and machine-verified only.
    mechanism: >
      The cart mandate, the digital contract binding user consent to a specific
      basket, is altered between user approval and authorization submission.
      Contents, price, or merchant differ from what was consented to while the
      cryptographic wrapper still validates.
    signals:
      - cart mandate hash mismatch against consent record
      - line items added post-consent
    parameters:
      substitution_type: {type: categorical, values: [line_item_add, price_uplift, merchant_swap, quantity_inflate]}
      value_uplift_ratio: {type: float, range: [1.05, 6.0], desc: submitted value over consented value}
      hash_validation_bypassed: {type: bool}
      time_to_substitution_ms: {type: int, range: [10, 60000]}
    defense_hooks:
      - mandate_hash_consistency
      - consent_to_auth_delta
    difficulty: 0.0
    difficulty_prior: 0.75
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: MND-03
    name: Incremental authorization scope creep
    family: mandate_abuse
    rails: [agentic_token, card_not_present]
    genai_leverage: Agent-native flows normalise incremental and partial auths.
    mechanism: >
      Attacker exploits incremental authorization to walk the captured amount
      upward in steps each of which sits inside the mandate's per-transaction
      tolerance, ending far above the consented total.
    signals:
      - incremental auth count above baseline for merchant category
      - cumulative capture exceeds original consent by material margin
    parameters:
      increment_count: {type: int, range: [2, 20]}
      per_increment_ratio: {type: float, range: [1.02, 1.25], desc: each step as a multiple of the running total}
      total_overage_ratio: {type: float, range: [1.1, 5.0], desc: final capture over original consent}
      merchant_category: {type: categorical, values: [travel, hospitality, fuel, marketplace, services]}
    defense_hooks:
      - cumulative_capture_vs_consent_ratio
      - incremental_auth_velocity
    difficulty: 0.74
    difficulty_prior: 0.6
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: MND-04
    name: Sub-cap structuring
    family: mandate_abuse
    rails: [agentic_token]
    genai_leverage: Agent can probe and enumerate policy limits cheaply.
    mechanism: >
      Attacker discovers the per-session or per-merchant cap and splits spend
      into many transactions each just under it, across sessions or merchants,
      to drain the credential without tripping a single limit.
    signals:
      - transaction amounts clustered immediately below a policy threshold
      - session count elevated with near-identical spend profile
    parameters:
      cap_proximity: {type: float, range: [0.85, 0.999], desc: amount as fraction of known cap}
      split_count: {type: int, range: [3, 60]}
      merchant_spread: {type: int, range: [1, 15]}
      window_hours: {type: float, range: [0.5, 168]}
    defense_hooks:
      - amount_to_cap_proximity_distribution
      - cross_session_aggregate_velocity
      - benford_deviation_on_amounts
    difficulty: 0.0
    difficulty_prior: 0.55
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: MND-05
    name: Allowlist aliasing via lookalike merchant
    family: mandate_abuse
    rails: [agentic_token]
    genai_leverage: Merchant descriptors and MCCs generated to match allowlist entries.
    mechanism: >
      Attacker registers a merchant whose descriptor, MCC, and name closely match
      an entry on the user's mandate allowlist, so scope enforcement at the
      network layer passes while the funds go elsewhere.
    signals:
      - merchant descriptor edit distance to allowlist entry below threshold
      - merchant acquirer and tax ID differ from allowlisted entity
    parameters:
      descriptor_edit_distance: {type: int, range: [0, 6]}
      mcc_match: {type: bool}
      acquirer_mismatch: {type: bool}
      merchant_tenure_days: {type: int, range: [1, 720]}
    defense_hooks:
      - descriptor_similarity_to_allowlist
      - entity_identity_vs_descriptor_consistency
    difficulty: 0.9
    difficulty_prior: 0.7
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: MND-06
    name: Stale mandate replay
    family: mandate_abuse
    rails: [agentic_token]
    genai_leverage: Automated capture and replay of intent payloads at scale.
    mechanism: >
      An intent payload or agentic token whose consent window has expired, or
      which was already consumed, is replayed against a merchant whose validation
      of freshness is weak.
    signals:
      - intent timestamp outside validity window
      - duplicate mandate identifier
    parameters:
      staleness_hours: {type: float, range: [0.1, 720]}
      replay_count: {type: int, range: [1, 25]}
      merchant_validation_strictness: {type: float, range: [0.0, 1.0]}
    defense_hooks:
      - mandate_freshness_check
      - mandate_id_replay_counter
    difficulty: 0.4
    status: stub

  - id: MND-07
    name: Recurring mandate hijack
    family: mandate_abuse
    rails: [agentic_token, card_not_present]
    genai_leverage: Subscription negotiation delegated to agents at scale.
    mechanism: >
      A legitimate recurring mandate is modified in amount, frequency, or
      beneficiary. Because the credential and the relationship are established,
      the modified stream inherits the trust of the original.
    signals:
      - amount or frequency step change on an established recurring series
      - beneficiary change on an existing series
    parameters:
      amount_step_ratio: {type: float, range: [1.1, 10.0]}
      frequency_multiplier: {type: float, range: [1.0, 12.0]}
      beneficiary_changed: {type: bool}
      series_age_months: {type: int, range: [1, 60]}
    defense_hooks:
      - recurring_series_change_point_score
      - beneficiary_stability
    difficulty: 0.86
    difficulty_prior: 0.65
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: MND-08
    name: Sub-agent scope inheritance abuse
    family: mandate_abuse
    rails: [agentic_token, b2b_invoice]
    genai_leverage: Multi-agent orchestration delegates credentials downward.
    mechanism: >
      A primary agent spawns or delegates to a sub-agent, which inherits or is
      granted a superset of the intended scope. Attacker compromises the weaker
      sub-agent and transacts under the primary's trust.
    signals:
      - authorization originating from an agent identity distinct from the enrolled one
      - delegation chain depth above baseline
    parameters:
      delegation_depth: {type: int, range: [1, 5]}
      scope_expansion_ratio: {type: float, range: [1.0, 8.0]}
      sub_agent_attested: {type: bool}
    defense_hooks:
      - delegation_chain_depth
      - effective_vs_granted_scope_ratio
      - terminal_agent_attestation_status
    difficulty: 0.85
    status: stub

# ---------------------------------------------------------------------------
# FAMILY: identity_spoofing
# ---------------------------------------------------------------------------

  - id: IDS-01
    name: Agent header and user-agent impersonation
    family: identity_spoofing
    rails: [agentic_token, card_not_present]
    genai_leverage: Trivially automated at very high volume.
    mechanism: >
      Attacker traffic declares itself as a well-known commercial agent so that
      merchants applying agent-friendly trust rules relax their controls.
      Impersonation of major agent identities is already observed at meaningful
      rates across large networks.
    signals:
      - declared agent identity fails cryptographic attestation
      - request origin ASN inconsistent with declared agent operator
    parameters:
      impersonated_agent: {type: categorical, values: [major_assistant, browser_agent, shopping_agent, crawler]}
      attestation_present: {type: bool}
      asn_consistency: {type: bool}
      request_volume_per_hour: {type: int, range: [10, 100000]}
    defense_hooks:
      - agent_attestation_verification
      - declared_identity_vs_network_origin
    difficulty: 0.78
    difficulty_prior: 0.35
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: IDS-02
    name: Agent attestation credential theft and replay
    family: identity_spoofing
    rails: [agentic_token]
    genai_leverage: Credential harvesting pipelines automated end to end.
    mechanism: >
      A genuine agent's attestation credential or signing key is stolen and
      replayed, so the attacker passes Know Your Agent checks cleanly while
      operating from foreign infrastructure.
    signals:
      - same agent credential asserted from disjoint infrastructure simultaneously
      - behavioural fingerprint divergence from the credential's history
    parameters:
      concurrent_origins: {type: int, range: [1, 20]}
      behavioural_divergence: {type: float, range: [0.0, 1.0]}
      credential_age_days: {type: int, range: [0, 400]}
    defense_hooks:
      - impossible_concurrency_check
      - agent_behavioural_fingerprint_distance
    difficulty: 1.0
    difficulty_prior: 0.8
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: IDS-03
    name: Counterfeit storefront tuned for agent heuristics
    family: identity_spoofing
    rails: [card_not_present, agentic_token]
    genai_leverage: Entire storefronts, catalogs, and review histories generated cheaply.
    mechanism: >
      A fraudulent storefront is engineered to satisfy exactly the structured
      signals an agent evaluates, valid SSL, complete schema markup, plausible
      reviews, below-market pricing, while lacking the visual and intuitive cues
      a human shopper would find suspicious. The agent optimising for best price
      completes the purchase and the operator harvests the payment data.
    signals:
      - structured signal completeness far exceeds site operational history
      - price below market with no supply explanation
      - no chargeback or dispute history
    parameters:
      schema_completeness: {type: float, range: [0.7, 1.0]}
      price_ratio_to_market: {type: float, range: [0.4, 0.9], desc: offer price over market price}
      site_age_days: {type: int, range: [1, 200]}
      review_authenticity: {type: float, range: [0.0, 0.5]}
      ssl_valid: {type: bool}
    defense_hooks:
      - structured_signal_vs_tenure_mismatch
      - price_plausibility_score
      - merchant_dispute_history_depth
    difficulty: 1.0
    difficulty_prior: 0.75
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: IDS-04
    name: Structured data manipulation for price bait
    family: identity_spoofing
    rails: [agentic_token]
    genai_leverage: Feed generation and mutation at catalog scale.
    mechanism: >
      Machine-readable price and availability data shown to the agent differs
      from the price actually authorized, exploiting the fact that the agent
      compares feeds rather than rendered pages.
    signals:
      - feed price to auth amount delta
      - availability claim unverifiable at fulfilment
    parameters:
      auth_to_feed_price_ratio: {type: float, range: [1.05, 3.0], desc: authorized amount over advertised feed price}
      fields_manipulated: {type: categorical, values: [price, availability, shipping, currency, tax]}
      currency_switch: {type: bool}
    defense_hooks:
      - advertised_vs_authorized_amount_delta
      - currency_consistency_check
    difficulty: 0.94
    difficulty_prior: 0.5
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: IDS-05
    name: Agent session token theft leading to agentic account takeover
    family: identity_spoofing
    rails: [agentic_token, card_not_present, account_to_account]
    genai_leverage: The compromised endpoint is itself an autonomous actor.
    mechanism: >
      Compromise of the agent, through host malware, account hijack, or session
      token theft, yields not one fraudulent transaction but persistent,
      mandate-aware access to the user's commerce relationships, executable at
      machine speed across many merchants in parallel.
    signals:
      - parallel merchant fan-out beyond human-plausible rate
      - transactions consistent with mandate but inconsistent with user history
      - no corresponding user-side interaction events
    parameters:
      merchant_fanout: {type: int, range: [2, 80]}
      duration_minutes: {type: float, range: [1, 1440]}
      per_txn_amount_usd: {type: float, range: [10, 5000]}
      mimics_user_history: {type: float, range: [0.0, 1.0]}
      user_interaction_events: {type: int, range: [0, 5]}
    defense_hooks:
      - parallel_merchant_fanout_rate
      - user_interaction_density
      - purchase_profile_kl_divergence_from_history
    difficulty: 0.58
    difficulty_prior: 0.9
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: IDS-06
    name: Synthetic agent provider registration
    family: identity_spoofing
    rails: [agentic_token]
    genai_leverage: Generated corporate documentation and web presence.
    mechanism: >
      Attacker onboards as a legitimate agentic commerce provider using
      synthetic corporate identity, obtaining a valid provider identifier and
      the trust that flows with it, then abuses it at scale before detection.
    signals:
      - provider identifier issued recently with atypical volume ramp
      - corporate documentation lacking verifiable third-party trace
    parameters:
      provider_age_days: {type: int, range: [1, 180]}
      volume_ramp_rate: {type: float, range: [1.0, 100.0]}
      doc_verifiability: {type: float, range: [0.0, 0.8]}
    defense_hooks:
      - provider_tenure_vs_volume
      - onboarding_document_verification_depth
    difficulty: 0.7
    status: stub

  - id: IDS-07
    name: Agent-to-agent collusion ring
    family: identity_spoofing
    rails: [agentic_token, card_not_present]
    genai_leverage: Coordination cost across many identities approaches zero.
    mechanism: >
      Buyer-side and merchant-side agents controlled by the same actor transact
      with each other to launder value, build fake reputation, or farm incentives,
      with behaviour deliberately decorrelated to defeat pairwise detection.
    signals:
      - graph community structure with abnormal reciprocity
      - fulfilment evidence absent or templated
    parameters:
      ring_size: {type: int, range: [3, 200]}
      reciprocity_ratio: {type: float, range: [0.3, 1.0]}
      decorrelation_effort: {type: float, range: [0.0, 1.0]}
      txn_per_pair: {type: int, range: [1, 30]}
    defense_hooks:
      - transaction_graph_community_density
      - reciprocity_and_cycle_detection
      - fulfilment_evidence_entropy
    difficulty: 0.0
    difficulty_prior: 0.8
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: IDS-08
    name: Agent host fingerprint cloning
    family: identity_spoofing
    rails: [card_not_present, agentic_token]
    genai_leverage: Fingerprint synthesis and mutation automated.
    mechanism: >
      Device and environment fingerprints associated with a trusted agent host
      are cloned so that device-reputation signals continue to score the attacker
      as the legitimate long-tenured device.
    signals:
      - fingerprint identical, network path and timing distribution different
      - clock skew and latency profile inconsistent with claimed geography
    parameters:
      fingerprint_fidelity: {type: float, range: [0.8, 1.0]}
      geo_inconsistency_km: {type: float, range: [0, 15000]}
      timing_profile_divergence: {type: float, range: [0.0, 1.0]}
    defense_hooks:
      - fingerprint_vs_network_path_consistency
      - latency_geography_plausibility
    difficulty: 0.65
    status: stub

# ---------------------------------------------------------------------------
# FAMILY: classical_genai  (control group for the headline experiment)
