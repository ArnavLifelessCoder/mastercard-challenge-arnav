    signals:
      - volume ramp shape inconsistent with organic acquisition curves
      - settlement delay preference and rapid payout requests
    parameters:
      ramp_months: {type: int, range: [1, 18]}
      spike_multiple: {type: float, range: [3.0, 100.0]}
      payout_acceleration_requests: {type: int, range: [0, 20]}
    defense_hooks:
      - merchant_volume_curve_shape_score
      - payout_timing_pressure_flag
    difficulty: 0.55
    status: stub

  - id: XRL-06
    name: Mule network orchestration
    family: cross_rail
    rails: [account_to_account, instant_payment]
    genai_leverage: Recruitment, instruction, and routing coordinated conversationally at scale.
    mechanism: >
      Funds are layered through many low-value accounts with routing decisions
      adapted in real time to observed friction, defeating static rules.
    signals:
      - fan-in fan-out graph motifs
      - holding time distribution unnaturally short
    parameters:
      layers: {type: int, range: [2, 8]}
      accounts_per_layer: {type: int, range: [3, 100]}
      holding_time_minutes: {type: float, range: [1, 2880]}
      adaptive_routing: {type: bool}
    defense_hooks:
