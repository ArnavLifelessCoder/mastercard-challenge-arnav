      - dispute_timing_boundary_clustering
    difficulty: 0.45
    status: stub

  - id: XRL-03
    name: Stored value and gift card drain via mandate
    family: cross_rail
    rails: [stored_value, agentic_token]
    genai_leverage: Agent flows can purchase and redeem instruments without human review.
    mechanism: >
      The agent is induced to purchase gift cards or stored-value instruments and
      disclose the codes, converting card credit into an irreversible instrument
      in a single mandate-compliant step.
    signals:
      - stored value MCC purchase inconsistent with stated task
      - code disclosure event in agent output
    parameters:
      instrument_count: {type: int, range: [1, 30]}
      face_value_usd: {type: float, range: [25, 1000]}
      disclosure_channel: {type: categorical, values: [page_form, email, chat, api_callback]}
      task_mcc_consistency: {type: bool}
    defense_hooks:
