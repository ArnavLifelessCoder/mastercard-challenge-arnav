  - id: CGA-01
    name: Real-time voice clone against step-up authentication
    family: classical_genai
    rails: [card_not_present, account_to_account, instant_payment]
    genai_leverage: Few seconds of reference audio yields real-time cloned speech.
    mechanism: >
      Attacker defeats voice biometric or call-centre verification during a
      step-up challenge, converting a declined or challenged transaction into an
      approved one.
    signals:
      - step-up challenge passed with atypical response latency
      - audio spectral artefacts
      - challenge originated from a device not previously enrolled
    parameters:
      clone_quality: {type: float, range: [0.5, 0.99]}
      reference_audio_seconds: {type: float, range: [3, 300]}
      challenge_type: {type: categorical, values: [voice_biometric, call_centre, ivr_passphrase]}
      response_latency_ms: {type: int, range: [80, 3000]}
    defense_hooks:
      - stepup_response_latency_distribution
      - liveness_artefact_score
      - device_enrolment_history
    difficulty: 0.9
    difficulty_prior: 0.7
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: CGA-02
    name: Deepfake identity verification bypass
    family: classical_genai
    rails: [card_not_present, account_to_account]
    genai_leverage: Photoreal document and face synthesis on commodity hardware.
    mechanism: >
      Synthetic face and document artefacts defeat onboarding ID and verification,
      producing a fully enrolled account or agentic credential under a controlled
      identity.
    signals:
      - injection rather than capture at the camera layer
      - document template consistency without issuing-authority verification
    parameters:
      injection_method: {type: categorical, values: [virtual_camera, emulator, replay, physical_display]}
      artefact_level: {type: float, range: [0.0, 0.6]}
      document_type: {type: categorical, values: [passport, national_id, licence, utility_bill]}
    defense_hooks:
      - capture_channel_integrity
      - passive_liveness_score
    difficulty: 0.65
    status: stub

  - id: CGA-03
    name: LLM-personalised phishing at scale
    family: classical_genai
    rails: [card_not_present, account_to_account]
    genai_leverage: Per-target personalisation at the cost of bulk sending.
    mechanism: >
      Individually tailored lures derived from public and breached data raise
      conversion by an order of magnitude over template phishing, feeding
      downstream credential and card compromise.
    signals:
      - credential use from novel geography shortly after lure delivery window
      - clustered compromise across a targeted cohort
    parameters:
      personalisation_depth: {type: float, range: [0.0, 1.0]}
      cohort_size: {type: int, range: [50, 500000]}
      conversion_rate: {type: float, range: [0.001, 0.15]}
      time_to_use_hours: {type: float, range: [0.1, 168]}
    defense_hooks:
      - cohort_compromise_clustering
      - credential_use_geo_novelty
    difficulty: 0.14
    difficulty_prior: 0.45
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: CGA-04
    name: Authorized push payment social engineering
    family: classical_genai
    rails: [instant_payment, account_to_account]
    genai_leverage: Sustained, adaptive, multi-channel persuasion without human effort.
    mechanism: >
      The victim authorizes the payment themselves, so every credential,
      device, and behavioural signal at authorization is genuine. The fraud lives
      entirely in the intent layer. This is the closest classical analogue to
      agentic fraud and belongs in the same conceptual bucket.
    signals:
      - first-time payee with high value
      - session duration and hesitation patterns atypical for the user
      - concurrent inbound call or messaging session
    parameters:
      grooming_duration_hours: {type: float, range: [0.5, 720]}
      channels_used: {type: int, range: [1, 4]}
      payee_novelty: {type: bool}
      amount_vs_balance_ratio: {type: float, range: [0.05, 1.0]}
      victim_hesitation_score: {type: float, range: [0.0, 1.0]}
    defense_hooks:
      - first_time_payee_value_risk
      - session_hesitation_biometrics
      - concurrent_channel_activity_flag
    difficulty: 1.0
    difficulty_prior: 0.85
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: CGA-05
    name: Synthetic identity manufacture at scale
    family: classical_genai
    rails: [card_not_present, account_to_account]
    genai_leverage: Coherent identity backstories, documents, and digital footprints.
    mechanism: >
      Fabricated identities are aged through small legitimate activity, then
      used for credit or credential acquisition and eventual bust-out.
    signals:
      - thin file with unusually clean early behaviour
      - shared attributes across supposedly unrelated identities
    parameters:
      aging_months: {type: int, range: [1, 36]}
      attribute_reuse_rate: {type: float, range: [0.0, 0.6]}
      cohort_size: {type: int, range: [10, 10000]}
      bustout_multiple: {type: float, range: [2.0, 30.0]}
    defense_hooks:
      - identity_attribute_graph_overlap
      - thin_file_behaviour_purity
    difficulty: 1.0
    difficulty_prior: 0.6
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: CGA-06
    name: Adaptive card testing swarm
    family: classical_genai
    rails: [card_not_present]
    genai_leverage: Model-driven retry policy adapts to decline reason codes live.
    mechanism: >
      Rather than brute-forcing at fixed rate, the swarm reads decline responses
      and adapts amount, merchant, timing, and geography to stay under velocity
      thresholds while maximising validation throughput.
    signals:
      - low-value authorizations across many BINs with structured decline pattern
      - adaptation visible as declining decline rate over time
    parameters:
      probe_amount_usd: {type: float, range: [0.1, 5.0]}
      bins_touched: {type: int, range: [5, 5000]}
      adaptation_rate: {type: float, range: [0.0, 1.0]}
      merchant_rotation: {type: int, range: [1, 50]}
      requests_per_minute: {type: int, range: [1, 2000]}
    defense_hooks:
      - decline_rate_trajectory_per_source
      - bin_dispersion_entropy
      - micro_amount_probe_density
    difficulty: 0.82
    difficulty_prior: 0.4
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: CGA-07
    name: Investment and romance scam scripting
    family: classical_genai
    rails: [instant_payment, account_to_account]
    genai_leverage: Persistent conversational presence across thousands of targets.
    mechanism: >
      Long-horizon relationship building culminates in victim-authorized
      transfers, often escalating in value and moving to less reversible rails.
    signals:
      - escalating transfer series to a payee cohort
      - rail migration toward irreversibility
    parameters:
      relationship_days: {type: int, range: [7, 540]}
      escalation_slope: {type: float, range: [1.05, 5.0]}
      transfers_count: {type: int, range: [2, 60]}
      rail_migration: {type: bool}
    defense_hooks:
      - payee_escalation_slope
      - rail_irreversibility_migration_flag
    difficulty: 0.8
    status: stub

  - id: CGA-08
    name: Call centre human-agent social engineering
    family: classical_genai
    rails: [card_not_present, account_to_account]
    genai_leverage: Scripted, emotionally calibrated pressure with perfect recall of stolen PII.
    mechanism: >
      The attack target is the issuer's own staff. Attacker uses synthesised
      context to pass knowledge-based authentication and obtain credential
      reissue, limit increases, or payee additions.
    signals:
      - servicing action followed rapidly by high-value spend
      - KBA passed with atypical answer latency
    parameters:
      kba_pass_confidence: {type: float, range: [0.5, 1.0]}
      servicing_action: {type: categorical, values: [reissue, limit_increase, payee_add, address_change, mandate_grant]}
      time_to_spend_minutes: {type: float, range: [1, 2880]}
    defense_hooks:
      - servicing_action_to_spend_latency
      - kba_answer_latency_profile
    difficulty: 0.8
    difficulty_prior: 0.7
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: CGA-09
    name: Conversational OTP relay
    family: classical_genai
    rails: [card_not_present, instant_payment]
    genai_leverage: Natural-sounding real-time interception without a human operator.
    mechanism: >
      An automated conversational front end contacts the victim in the moments
      after a genuine challenge is triggered and relays the one-time code to the
      attacker's session in real time.
    signals:
      - OTP consumed from a session distinct from the one that requested it
      - very tight timing between issuance and use
    parameters:
      relay_latency_seconds: {type: float, range: [3, 120]}
      session_mismatch: {type: bool}
      contact_channel: {type: categorical, values: [voice, sms, chat, push]}
      success_rate: {type: float, range: [0.05, 0.6]}
    defense_hooks:
      - otp_issuance_to_use_session_binding
      - challenge_response_channel_correlation
    difficulty: 1.0
    difficulty_prior: 0.5
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: CGA-10
    name: Merchant onboarding document forgery
    family: classical_genai
    rails: [card_not_present, b2b_invoice]
    genai_leverage: Convincing incorporation, banking, and trading documents.
    mechanism: >
      Fraudulent merchants are onboarded to acquiring using synthetic
      documentation, then used for transaction laundering or bust-out.
    signals:
      - document metadata inconsistency
      - processing volume misaligned with declared business model
    parameters:
      doc_quality: {type: float, range: [0.5, 0.98]}
      declared_vs_actual_mcc_mismatch: {type: bool}
      ramp_to_volume_days: {type: int, range: [3, 120]}
    defense_hooks:
      - declared_business_model_vs_txn_profile
      - document_metadata_forensics
    difficulty: 0.55
    status: stub

