      - funds_holding_time_distribution
    difficulty: 1.0
    difficulty_prior: 0.75
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: XRL-07
    name: Instant rail irreversibility arbitrage
    family: cross_rail
    rails: [instant_payment, account_to_account]
    genai_leverage: Rail selection optimised per jurisdiction and per victim profile.
    mechanism: >
      Attacker deliberately steers value onto rails with the weakest recall
      mechanics and the shortest intervention window, chosen dynamically.
    signals:
      - rail choice inconsistent with transaction purpose and amount
      - timing aligned to operational coverage gaps
    parameters:
      rail_switch_count: {type: int, range: [1, 5]}
      timing_offset_hours: {type: float, range: [0, 24], desc: offset into low-coverage window}
      jurisdiction_hops: {type: int, range: [0, 4]}
    defense_hooks:
      - rail_choice_vs_purpose_consistency
      - operational_coverage_window_risk
    difficulty: 0.65
    status: stub

