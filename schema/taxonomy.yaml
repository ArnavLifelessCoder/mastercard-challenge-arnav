      - instrument_code_egress_detection
    difficulty: 0.94
    difficulty_prior: 0.6
    difficulty_source: measured_evasion_rate_round_7
    status: implemented

  - id: XRL-04
    name: B2B invoice redirection
    family: cross_rail
    rails: [b2b_invoice, account_to_account]
    genai_leverage: Thread-aware impersonation of a known supplier's correspondence style.
    mechanism: >
      Supplier banking details are changed on a genuine payable, frequently via a
      hijacked email thread and increasingly via agent memory. Single-event
